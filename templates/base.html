<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <title>{% block title %}PlusPC - Компьютерная помощь{% endblock %}</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/pluspc.jpg') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/pluspc.jpg') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="container">
        <nav class="navbar">
            <a href="/" class="logo-link">
                <div class="logo-container">
                    <img src="{{ url_for('static', filename='images/pluspc.jpg') }}" alt="PlusPC" class="logo-img" onerror="this.style.display='none'">
                    <div class="logo-text">
                        <span class="logo-main">PlusPC</span>
                        <div class="logo-subtitle">IT-Команда</div>
                    </div>
                </div>
            </a>
            <ul class="nav-menu">
                <li><a href="{{ url_for('index') }}#services-calculator">Услуги</a></li>
                <li><a href="{{ url_for('index') }}#why-us">Почему мы</a></li>
                <li><a href="{{ url_for('index') }}#contact">Контакты</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="container">
        <div class="sponsors-header">
            <h4 class="sponsors-title">Спонсоры</h4>
            <div class="sponsors-divider"><span></span></div>
        </div>
        <div class="sponsors-grid">
            <a href="#" class="sponsor-item" target="_blank">
                <img src="{{ url_for('static', filename='images/DELLL.jpg') }}" alt="DELL">
            </a>
            <a href="#" class="sponsor-item" target="_blank">
                <img src="{{ url_for('static', filename='images/nvid.jpeg') }}" alt="NVIDIA">
            </a>
            <a href="#" class="sponsor-item" target="_blank">
                <img src="{{ url_for('static', filename='images/ACER.png') }}" alt="ACER">
            </a>
            <a href="#" class="sponsor-item" target="_blank">
                <img src="{{ url_for('static', filename='images/Win.png') }}" alt="Windows">
            </a>
        </div>
        <div class="footer-links">
            <a href="{{ url_for('privacy_policy') }}" class="footer-link">Политика конфиденциальности</a>
            <span class="footer-link-separator">•</span>
            <a href="{{ url_for('cookie_policy') }}" class="footer-link">Политика cookie</a>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 PlusPC. Все права защищены.</p>
        </div>
    </div>
</footer>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

<!-- COOKIE БАННЕР -->
<div id="cookieBanner" class="cookie-banner">
    <div class="cookie-banner-content">
        <div class="cookie-banner-text">
            <strong>Мы используем файлы cookie</strong>
            <p>Мы используем cookie для улучшения работы сайта. <a href="/privacy-policy" class="cookie-link">Подробнее</a></p>
        </div>
        <div class="cookie-banner-buttons">
            <button id="cookieAcceptBtn" class="cookie-btn cookie-accept">Принять</button>
            <button id="cookieDeclineBtn" class="cookie-btn cookie-decline">Отклонить</button>
        </div>
    </div>
</div>

<style>
<style>
/* ===== ПЛАВАЮЩАЯ КНОПКА ===== */
.floating-messengers {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 10000;
}
.floating-toggle {
    width: 60px;
    height: 60px;
    background: #000;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #fff;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}
.floating-toggle i { font-size: 24px; }
.toggle-text { font-size: 9px; margin-top: 2px; }
.floating-menu {
    position: absolute;
    bottom: 70px;
    right: 0;
    display: none;
    flex-direction: column;
    gap: 10px;
}
.floating-messengers.active .floating-menu { display: flex; }
.floating-item {
    width: 180px;
    padding: 12px 20px;
    background: #fff;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #333;
    font-weight: 500;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
.floating-item i { width: 20px; font-size: 18px; }
.floating-item.telegram:hover { background: #0088cc; color: #fff; }
.floating-item.max:hover { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff; }
.floating-item.vk:hover { background: #4a76a8; color: #fff; }
.floating-item.email:hover { background: #ea4335; color: #fff; }
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.floating-menu { animation: fadeInUp 0.3s ease; }

/* ===== ПОДВАЛ ===== */
.footer {
    background: #0a0a0a;
    padding: 60px 0 30px;
    margin-top: 60px;
    border-top: 1px solid rgba(255,255,255,0.1);
}
.sponsors-header { text-align: center; margin-bottom: 40px; }
.sponsors-title { font-size: 1.8rem; font-weight: 700; color: #fff; margin-bottom: 15px; letter-spacing: 2px; }
.sponsors-divider span { width: 60px; height: 3px; background: #fff; border-radius: 2px; display: inline-block; }
.sponsors-grid {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 50px;
    flex-wrap: wrap;
    margin-bottom: 50px;
}
.sponsor-item { display: inline-block; text-decoration: none; transition: transform 0.3s ease; }
.sponsor-item:hover { transform: translateY(-5px); }
.sponsor-item img { max-width: 120px; max-height: 70px; object-fit: contain; display: block; }
.footer-bottom { text-align: center; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); }
.footer-bottom p { color: rgba(255,255,255,0.5); font-size: 0.85rem; margin: 0; }
.footer-links {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 30px 0 20px;
}
.footer-link { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.8rem; transition: color 0.3s; }
.footer-link:hover { color: #fff; text-decoration: underline; }

/* ===== БУРГЕР-МЕНЮ ===== */
.hamburger {
    display: none;
    cursor: pointer;
    width: 30px;
    height: 20px;
    position: relative;
    z-index: 1001;
}
.hamburger span {
    display: block;
    width: 100%;
    height: 2px;
    background: #000;
    position: absolute;
    transition: all 0.3s ease;
}
.hamburger span:nth-child(1) { top: 0; }
.hamburger span:nth-child(2) { top: 50%; transform: translateY(-50%); }
.hamburger span:nth-child(3) { bottom: 0; }
.hamburger.active span:nth-child(1) { transform: rotate(45deg); top: 50%; }
.hamburger.active span:nth-child(2) { opacity: 0; }
.hamburger.active span:nth-child(3) { transform: rotate(-45deg); bottom: 40%; }

/* ===== АДАПТИВ ДЛЯ МОБИЛЬНЫХ (ОБЪЕДИНЁННЫЙ) ===== */
@media (max-width: 768px) {
    /* Навигация */
    .navbar { position: relative; justify-content: space-between; }
    .nav-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        flex-direction: column;
        padding: 20px;
        gap: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        border-radius: 0 0 20px 20px;
        z-index: 999;
    }
    .nav-menu.active { display: flex; }
    .nav-menu a {
        padding: 12px 0;
        font-size: 1rem;
        text-align: center;
        border-bottom: 1px solid #f0f0f0;
    }
    .nav-menu a:last-child { border-bottom: none; }
    .hamburger { display: block; }

    /* Общие */
    .container { padding: 0 16px; }
    .section { padding: 50px 0; }

    /* Плавающая кнопка */
    .floating-messengers { bottom: 20px; right: 20px; }
    .floating-toggle { width: 50px; height: 50px; }
    .floating-toggle i { font-size: 20px; }
    .floating-item { width: 150px; padding: 10px 16px; font-size: 0.85rem; }
    .floating-item i { width: 18px; font-size: 16px; }

    /* Подвал */
    .sponsors-grid { gap: 20px; }
    .sponsor-item { width: 100px; }
    .footer-links { flex-direction: column; gap: 10px; }
    .footer-link-separator { display: none; }

    /* Герой-секция */
    .hero-content { padding: 30px 20px !important; margin: 0 15px !important; }
    .hero-title .highlight { font-size: 2rem !important; }
    .hero-title span:first-child { font-size: 1.2rem !important; }
    .hero-subtitle { font-size: 0.9rem !important; }
    .hero-buttons { flex-direction: column; align-items: center; gap: 10px; }
    .btn-messenger { width: 200px; justify-content: center; }

    /* О нас */
    .about-block { grid-template-columns: 1fr !important; gap: 30px !important; }
    .about-text { text-align: center; padding: 0 !important; }
    .about-image img { height: 250px !important; }

    /* Почему мы */
    .why-grid { grid-template-columns: 1fr !important; }

    /* Калькулятор */
    .calc-columns { grid-template-columns: 1fr !important; }

    /* Наши работы */
    .works-slide-content { flex-direction: column !important; padding: 20px !important; text-align: center; }
    .works-slide-image img { height: 200px !important; }
    .works-slide-text h3 { font-size: 1.2rem !important; }

    /* Галерея */
    .gallery-slide img { height: 300px !important; }

    /* Стрелки карусели */
    .carousel-nav { width: 30px !important; height: 30px !important; font-size: 14px !important; }

    /* Общая стоимость */
    .total-wrapper { flex-direction: column; align-items: center; }
    .total-price { font-size: 2rem !important; }

    /* Контакты */
    .contact-card { padding: 20px !important; }
    .contact-item { flex-direction: column; text-align: center; }
    .social-links { flex-direction: column; align-items: center; }
    .social-link { width: 100%; justify-content: center; }
}

@media (max-width: 480px) {
    .sponsor-item { width: 80px; }
    .sponsor-item img { max-height: 50px; }
    .floating-item { width: 140px; padding: 8px 14px; }
    .hero-title .highlight { font-size: 1.5rem !important; }
    .section-title { font-size: 1.5rem !important; }
    .about-image img { height: 200px !important; }
    .works-slide-image img { height: 160px !important; }
    .gallery-slide img { height: 250px !important; }
}
</style>
</style>

<script>
// Активация плавающей кнопки
document.addEventListener('DOMContentLoaded', function() {
    const floatingMessengers = document.querySelector('.floating-messengers');
    const floatingToggle = document.querySelector('.floating-toggle');

    if (floatingToggle && floatingMessengers) {
        floatingToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            floatingMessengers.classList.toggle('active');
        });

        document.addEventListener('click', function(e) {
            if (!floatingMessengers.contains(e.target)) {
                floatingMessengers.classList.remove('active');
            }
        });
    }
});

// Активация бургер-меню
document.addEventListener('DOMContentLoaded', function() {
    const hamburger = document.querySelector('.hamburger');
    const navMenu = document.querySelector('.nav-menu');

    if (hamburger && navMenu) {
        hamburger.addEventListener('click', function() {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
            document.body.style.overflow = navMenu.classList.contains('active') ? 'hidden' : '';
        });

        navMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
                document.body.style.overflow = '';
            });
        });
    }
});
</script>

<script>
// Cookie banner
(function() {
    var banner = document.getElementById('cookieBanner');
    var acceptBtn = document.getElementById('cookieAcceptBtn');
    var declineBtn = document.getElementById('cookieDeclineBtn');

    if (!banner) return;

    var consent = localStorage.getItem('cookieConsent');

    if (!consent) {
        setTimeout(function() { banner.classList.add('show'); }, 500);
    } else {
        banner.style.display = 'none';
    }

    if (acceptBtn) {
        acceptBtn.onclick = function() {
            localStorage.setItem('cookieConsent', 'accepted');
            banner.classList.remove('show');
        };
    }

    if (declineBtn) {
        declineBtn.onclick = function() {
            localStorage.setItem('cookieConsent', 'declined');
            banner.classList.remove('show');
        };
    }
})();
</script>

</body>
</html>
